[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-decision-lab"
version = "1.0.0"
description = "Point-in-time pairs research and FP&A scenario planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Taher Abdeali Chandiwala"}]
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "statsmodels>=0.14,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
